# Lokal: backend + postgres. Werte kommen aus .env (Vorlage: .env.example).
#   docker compose up --build
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Host-Port 5433, damit eine lokale Postgres-Installation auf 5432 nicht stört
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/portfolio
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
