# Cloudflare Pages: Projekt silvan-os (docs/deploy.md).
# Gilt für `wrangler pages deploy` aus dem Ordner frontend/. Die Pages Functions liegen in functions/.
name = "silvan-os"
pages_build_output_dir = "./dist"
compatibility_date = "2025-06-01"

# IPA-Lernassistent (server/ipaAgent.ts): Workers AI ...
[ai]
binding = "AI"

# ... und Silvans Lernnotizen als Vektoren (eingelesen mit scripts/ingest-notes.ts)
[[vectorize]]
binding = "NOTES"
index_name = "ipa-notes"
