# Cloudflare Pages: Projekt silvan-os (docs/deploy.md).
# Gilt für `wrangler pages deploy` aus dem Ordner frontend/. Die Pages Functions liegen in functions/.
name = "silvan-os"
pages_build_output_dir = "./dist"
compatibility_date = "2025-06-01"

# IPA-Lernassistent (server/ipaAgent.ts): Workers AI ...
[ai]
binding = "AI"

# ... und Silvans Lernnotizen als Vektoren (eingelesen mit scripts/ingest-notes.ts)
[[vectorize]]
binding = "NOTES"
index_name = "ipa-notes"

# Live-Daten (server/liveData.ts): Clips, Wochenberichte, IPA-Zähler.
# Migrationen: npx wrangler d1 migrations apply silvan-os --remote
[[d1_databases]]
binding = "DB"
database_name = "silvan-os"
database_id = "b3b72cad-cc78-48a8-af87-99495f862f04"
migrations_dir = "migrations"
