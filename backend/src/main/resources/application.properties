spring.application.name=portfolio

# Frontend origins allowed to call /api/** (comma-separated)
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Keys for the write endpoints (header X-Api-Key). Empty = endpoint closed (503).
app.api-keys.clipper=${CLIPPER_API_KEY:}
app.api-keys.agents=${AGENTS_API_KEY:}

# ipa-assistant (separate project). Empty URL = assistant offline, the chat shows examples.
app.ipa.url=${IPA_ASSISTANT_URL:}
app.ipa.access-client-id=${IPA_ACCESS_CLIENT_ID:}
app.ipa.access-client-secret=${IPA_ACCESS_CLIENT_SECRET:}
# Only behind the Fly proxy: there Fly-Client-IP is set by Fly and cannot be faked
app.ipa.trust-fly-client-ip=${TRUST_FLY_CLIENT_IP:false}

# Postgres (local: docker compose, production: Neon). Flyway migrates on start.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/portfolio}
spring.datasource.username=${POSTGRES_USER:portfolio}
spring.datasource.password=${POSTGRES_PASSWORD:}
# No idle connections, so a serverless database can go to sleep
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=5000

# Short cache: /api/status hits the database at most every 30 s
spring.cache.cache-names=status
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=30s

# Only expose the health endpoint (used by Docker healthcheck), without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Health = the app itself. A missing database must not take the API off the proxy:
# /api/status then answers with nulls and the frontend shows its stored data.
management.health.db.enabled=false

# Behind the Fly.io proxy: trust X-Forwarded-* for scheme and host
server.forward-headers-strategy=framework

# Do not leak stack traces or messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
