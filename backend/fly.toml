# Fly.io configuration for the backend (https://fly.io/docs/reference/configuration/)
# Deployed by .github/workflows/backend.yml after a merge to main.

app = 'silvan-os-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  FRONTEND_ORIGIN = 'https://silvanbrors.ch,https://www.silvanbrors.ch'

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when idle to keep costs near zero. The first request after a pause
  # wakes the machine; until it answers, the frontend shows the stored data.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
